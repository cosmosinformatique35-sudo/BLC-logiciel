<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAMBISTE TECHNOLOGIE — Catalogue en ligne</title>
<style>
  :root { --or: #c9a15a; --or-fonce: #a5793a; --charbon: #1b1a22; --creme: #f7f3ec; --muted: #7c7568; --bordure: #e6ddc9; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: var(--creme); color: var(--charbon); }
  header { background: var(--charbon); color: var(--creme); padding: 22px 18px; text-align: center; }
  header img { max-height: 56px; max-width: 200px; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto; }
  header h1 { font-family: Georgia, serif; font-size: 22px; margin: 4px 0 2px; color: var(--or); }
  header .coord { font-size: 12.5px; color: #c9c4b8; }
  .filtres { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 18px 0; }
  .filtre-btn { background: #fff; border: 1px solid var(--bordure); color: var(--charbon); padding: 6px 14px; border-radius: 20px; font-size: 12.5px; cursor: pointer; }
  .filtre-btn.active { background: var(--charbon); color: var(--or); border-color: var(--charbon); }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 18px; }
  .carte { background: #fff; border: 1px solid var(--bordure); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .carte-photo { aspect-ratio: 1; overflow: hidden; background: #efe9dc; }
  .carte-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .carte-corps { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
  .carte-nom { font-weight: 600; font-size: 14.5px; }
  .carte-prix { color: var(--or-fonce); font-family: Georgia, serif; font-size: 15px; }
  .carte-variantes { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
  .variante-pill { border: 1px solid var(--bordure); border-radius: 14px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; background: #fff; }
  .variante-pill.selectionne { background: var(--charbon); color: var(--or); border-color: var(--charbon); }
  .variante-pill.rupture { opacity: 0.4; text-decoration: line-through; cursor: not-allowed; }
  .btn-ajouter { margin-top: 6px; background: var(--or); border: none; color: var(--charbon); font-weight: 600; padding: 9px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .btn-ajouter:disabled { background: #e2dbc9; color: #a49d8c; cursor: not-allowed; }
  .panier-flottant {
    position: fixed; bottom: 20px; right: 20px; background: var(--charbon); color: var(--or);
    border-radius: 50px; padding: 14px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 50; border: none;
  }
  .panier-flottant .compte { background: var(--or); color: var(--charbon); border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; margin-left: 6px; }
  .panier-overlay { position: fixed; inset: 0; background: rgba(20,18,14,0.5); display: none; z-index: 100; align-items: flex-end; justify-content: center; }
  .panier-overlay.ouvert { display: flex; }
  .panier-panneau { background: #fff; width: 100%; max-width: 480px; max-height: 82vh; border-radius: 16px 16px 0 0; padding: 20px; overflow-y: auto; }
  .panier-panneau h2 { font-family: Georgia, serif; margin: 0 0 12px; font-size: 18px; }
  .ligne-panier { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--bordure); font-size: 13.5px; }
  .qte-ctrl { display: flex; align-items: center; gap: 8px; }
  .qte-ctrl button { width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--bordure); background: #fff; cursor: pointer; }
  .panier-total { display: flex; justify-content: space-between; font-family: Georgia, serif; font-size: 17px; padding-top: 12px; color: var(--or-fonce); }
  .btn-commander { width: 100%; background: #25D366; color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 14.5px; font-weight: 600; margin-top: 14px; cursor: pointer; }
  .btn-fermer-panier { background: none; border: none; color: var(--muted); float: right; font-size: 18px; cursor: pointer; }
  .vide { text-align: center; color: var(--muted); padding: 30px 0; font-size: 13.5px; }
  .fallback-tel { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  footer { text-align: center; padding: 30px 18px; color: var(--muted); font-size: 12px; }
</style>
</head>

  const DEVISE = "FCFA";
  const WHATSAPP = "778009473";
  const NOM_BOUTIQUE = "BAMBISTE TECHNOLOGIE";
  let panier = JSON.parse(localStorage.getItem('panier_boutique') || '[]');
  let selections = {};

  function fmt(n) { return Number(n||0).toLocaleString('fr-FR'); }
  function sauverPanier() { localStorage.setItem('panier_boutique', JSON.stringify(panier)); }

  function libelleVariante(v) { return [v.taille, v.couleur].filter(Boolean).join(' / ') || 'Standard'; }

  function rendreVariantes(article) {
    const wrap = document.getElementById('variantes-' + article.id);
    wrap.innerHTML = article.variantes.map(v => `<span class="variante-pill ${v.stock<=0?'rupture':''} ${selections[article.id]===v.id?'selectionne':''}" data-produit="${article.id}" data-variante="${v.id}">${libelleVariante(v)}</span>`).join('');
    wrap.querySelectorAll('.variante-pill:not(.rupture)').forEach(pill => {
      pill.addEventListener('click', () => {
        selections[article.id] = parseInt(pill.dataset.variante, 10);
        rendreVariantes(article);
        document.querySelector('.btn-ajouter[data-produit="'+article.id+'"]').disabled = false;
      });
    });
  }

  ARTICLES.forEach(rendreVariantes);

  document.querySelectorAll('.btn-ajouter').forEach(btn => {
    btn.addEventListener('click', () => {
      const produitId = parseInt(btn.dataset.produit, 10);
      const varianteId = selections[produitId];
      if (!varianteId) return;
      const article = ARTICLES.find(a => a.id === produitId);
      const variante = article.variantes.find(v => v.id === varianteId);
      const existant = panier.find(l => l.varianteId === varianteId);
      if (existant) { existant.quantite += 1; }
      else { panier.push({ produitId, varianteId, nom: article.nom, variante: libelleVariante(variante), prix: article.prix, quantite: 1 }); }
      sauverPanier();
      rafraichirPanier();
      btn.textContent = 'Ajouté ✓';
      setTimeout(() => { btn.textContent = 'Ajouter au panier'; }, 900);
    });
  });

  function rafraichirPanier() {
    document.getElementById('panier-compte').textContent = panier.reduce((s,l)=>s+l.quantite,0);
    const wrap = document.getElementById('panier-lignes');
    if (panier.length === 0) { wrap.innerHTML = '<div class="vide">Votre panier est vide</div>'; }
    else {
      wrap.innerHTML = panier.map((l,i) => `
        <div class="ligne-panier">
          <div>${l.nom}<br><small>${l.variante} · ${fmt(l.prix)} ${DEVISE}</small></div>
          <div class="qte-ctrl">
            <button data-i="${i}" data-d="-1">−</button>${l.quantite}<button data-i="${i}" data-d="1">+</button>
          </div>
        </div>`).join('');
      wrap.querySelectorAll('button[data-d]').forEach(b => {
        b.addEventListener('click', () => {
          const i = parseInt(b.dataset.i,10), d = parseInt(b.dataset.d,10);
          panier[i].quantite += d;
          if (panier[i].quantite <= 0) panier.splice(i,1);
          sauverPanier(); rafraichirPanier();
        });
      });
    }
    const total = panier.reduce((s,l)=>s+l.quantite*l.prix,0);
    document.getElementById('panier-total-val').textContent = fmt(total) + ' ' + DEVISE;
  }

  document.getElementById('btn-ouvrir-panier').addEventListener('click', () => document.getElementById('panier-overlay').classList.add('ouvert'));
  document.getElementById('btn-fermer-panier').addEventListener('click', () => document.getElementById('panier-overlay').classList.remove('ouvert'));

  const btnCommander = document.getElementById('btn-commander');
  if (btnCommander) {
    btnCommander.addEventListener('click', () => {
      if (panier.length === 0) return;
      let msg = 'Bonjour ' + NOM_BOUTIQUE + ', je souhaite commander :%0A';
      panier.forEach(l => { msg += '- ' + l.quantite + ' x ' + l.nom + ' (' + l.variante + ') — ' + fmt(l.prix*l.quantite) + ' ' + DEVISE + '%0A'; });
      const total = panier.reduce((s,l)=>s+l.quantite*l.prix,0);
      msg += 'Total : ' + fmt(total) + ' ' + DEVISE + '%0A%0AMon nom : %0AMon adresse de livraison : ';
      window.open('https://wa.me/' + WHATSAPP + '?text=' + msg, '_blank');
    });
  }

  if (document.getElementById('filtres')) {
    document.querySelectorAll('.filtre-btn').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.filtre-btn').forEach(x => x.classList.toggle('active', x===b));
        const cat = b.dataset.cat;
        document.querySelectorAll('.carte').forEach(c => {
          c.style.display = (!cat || c.dataset.cat === cat) ? '' : 'none';
        });
      });
    });
  }

  rafraichirPanier();
</script>
